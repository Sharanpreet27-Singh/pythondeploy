<article class="card product">
  <span class="icon">{{ s.icon }}</span>
  <h3>{{ s.name }}</h3>
  <p class="role">{{ s.brand }}, {{ s.size }}</p>
  <p>{{ s.text }}</p>
  <p class="price">₹{{ '{:,}'.format(s.price) }}</p>
  <a class="btn btn-small" href="https://wa.me/919876543210?text=I%20want%20to%20order%20{{ s.name|urlencode }}">Order on WhatsApp</a>
</article>
